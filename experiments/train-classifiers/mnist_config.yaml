# MNIST Configuration
# Simple dataset - quick convergence, high learning rate, fewer epochs

dataset: mnist

classifiers:
  - cnn
  - vgg16
  - densenet
  - resnet50
  - vit

training:
  # Training schedule
  batch_size: 64
  epochs: 30
  
  # Learning
  lr: 0.001
  optimizer: adam              # adam or sgd
  momentum: 0.9                # For SGD optimizer
  weight_decay: 0.00001        # L2 regularization (very light for simple dataset)
  
  # Learning rate schedule
  lr_schedule: none            # none, cosine, step
  warmup_epochs: 0             # No warmup needed for simple data
  
  # Regularization
  dropout: 0.3                 # Light dropout needed
