# Chest X-Ray Configuration
# Complex medical imaging dataset - careful learning, strong regularization

dataset: chest-xray

classifiers:
  - cnn
  - vgg16
  - densenet
  - resnet50
  - vit

training:
  # Training schedule
  batch_size: 32               # Smaller batches for complex images
  epochs: 100
  
  # Learning
  lr: 0.0001                   # Conservative learning rate
  optimizer: adam              # adam or sgd
  momentum: 0.9                # For SGD optimizer
  weight_decay: 0.0001         # Strong L2 regularization
  
  # Learning rate schedule
  lr_schedule: cosine          # Cosine annealing recommended for medical data
  warmup_epochs: 2             # Warmup helps stabilize training
  
  # Regularization
  dropout: 0.7                 # Strong dropout for complex patterns
