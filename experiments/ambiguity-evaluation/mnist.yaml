data_dir: data
out_dir: models
device: cuda:1
seed: 26

datasets:
  training: mnist
  evaluation:
    - mnist
    - synthetic-mnist
    - ambiguous-mnist
    - ambiguess-mnist
    - companion-mnist

classifiers:
  - cnn
  - fully-connected
  - resnet
  - densenet

training:
  batch_size: 64
  epochs: 20
  lr: 0.0001
