data_dir: data
out_dir: models
device: cuda:1
seed: 26

datasets:
  training: chest-xray
  evaluation:
    - chest-xray
    - synthetic-chest-xray
    - companion-chest-xray
  balanced: true

classifiers:
  - cnn
  - fully-connected
  - resnet
  - densenet

training:
  batch_size: 32
  epochs: 40
  lr: 0.0001
