data_dir: data
out_dir: models
device: cuda:1
seed: 4 # do not change

datasets:
  training: fashion-mnist
  evaluation:
    - fashion-mnist
    - synthetic-fashion-mnist
    - ambiguess-fashion-mnist
    - companion-fashion-mnist
    - companion-ambiguous-fashion-mnist

classifiers:
  - cnn
  - fully-connected
  - resnet
  - vgg
  - densenet

training:
  batch_size: 32
  epochs: 20
