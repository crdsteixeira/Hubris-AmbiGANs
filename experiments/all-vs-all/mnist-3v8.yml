project: AmbiGAN
name: mnist-3v8  # <<<<<<
out_dir: out
data_dir: data
fixed_noise: 128
test_noise_seed: 15
device: cuda:1

num_runs: 1

gen_test_noise: false
gen_pairwise_inception: true
gen_classifiers: true
gen_gan: true
gen_dataset: true
run_ambiguity_evaluation: false
run_hubris_evaluation: false

dataset:
  name: mnist
  binary: 
    pos: 3   # <<<<<<
    neg: 8   # <<<<<<

classifiers:
  - name: ensemble_mean_32_mnist_50_3v8_balanced # <<<<<<
    c_type: ensemble
    batch_size: 800
    epochs: 50 
    lr: 0.001
    nf: 50 
    seed: 32
    ensemble_type: cnn
    ensemble_output_method: mean

step_1_seeds:
  - 2
step_2_seeds:
  - 2

model:
  z_dim: 256
  architecture:
    name: dcgan
    g_filter_dim: 512
    d_filter_dim: 512
    g_num_blocks: 2
    d_num_blocks: 2
  loss:
    name: ns

optimizer:
  lr: 0.0002
  beta1: 0.00
  beta2: 0.999

train:
  step_1:
    epochs: 50
    checkpoint_every: 10
    disc_iters: 1
    batch_size: 32
  step_2:
    epochs: 50
    checkpoint_every: 20
    disc_iters: 1
    batch_size: 32
    step_1_epochs:
      - last
    classifier:
      - ensemble_mean_32_mnist_50_3v8_balanced # <<<<<<
    weight:
      - gaussian:
          - alpha: 0.50 
            var: 0.10

evaluation:
  companion_n_samples: 2500
  ambiguity:
    models:
      - cnn
      - vgg16
      - densenet
      - resnet50
      - vit
    datasets:
      - ambiguous-mnist
      - ambiguess-mnist
      - companion-mnist
  hubris:
    models: 
      - convnext
    epochs: 10
    batch_size: 64
  
