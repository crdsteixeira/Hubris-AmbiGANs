# Global definitions
project: AmbiGAN
name: chest-xray
out_dir: out
data_dir: data
fixed_noise: 128
test_noise_seed: 15
device: cuda:1

# Number of runs to perform using same parameters but different seeds.
num_runs: 1

# Configuration
gen_test_noise: false
gen_pairwise_inception: false
gen_classifiers: false
gen_gan: false
gen_dataset: false
run_hubris_evaluation: true

# Dataset parameters, including positive and negative class.
dataset:
  name: chest-xray
  binary:
    pos: 1
    neg: 0

# Classifier list to be generated.
classifiers:
  - name: ensemble_mean_32_chestxray_100_balanced_128
    c_type: ensemble
    batch_size: 800
    epochs: 100 # old 200
    lr: 0.001
    nf: 50
    seed: 32
    ensemble_type: cnn
    ensemble_output_method: mean

# Seed parameters for each run (step1 and step2).
step_1_seeds:
  - 42
step_2_seeds:
  - 34

# GAN model parameters
model:
  z_dim: 512
  architecture:
    name: dcgan
    g_filter_dim: 128
    d_filter_dim: 128
    g_num_blocks: 4
    d_num_blocks: 4
  loss:
    name: ns

# GAN optimizer parameters
optimizer:
  lr: 0.001
  beta1: 0.00
  beta2: 0.999

# GAN training parameters
train:
  step_1:
    epochs: 100
    checkpoint_every: 20
    disc_iters: 1
    batch_size: 32
  step_2:
    epochs: 100
    checkpoint_every: 10
    disc_iters: 1
    batch_size: 32
    step_1_epochs:
      - last
    classifier:
      - ensemble_mean_32_chestxray_100_balanced_128
    weight:
      - gaussian:
          - alpha: 1.50
            var: 0.1

evaluation:
  companion_n_samples: 2500
  hubris:
    models: 
      - convnext         
      - efficientnetv2
      - vit             
      - swin          
    epochs: 5
    batch_size: 32
